name: Luna Pages — Publish (GitHub Actions)

# GitHub Pages Settings > Pages > Build and deployment > Source: GitHub Actions
# Publish ONLY site/, never Python sources, experiments, results, or user data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-tests/**"
      - ".github/workflows/pages-manual-publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luna-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated static Luna
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static application before deployment
        run: node site-tests/static-smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
