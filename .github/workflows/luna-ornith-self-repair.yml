name: Luna GameDev — Ornith Genuine Self-Repair of Playtest Bugs
on:
  workflow_dispatch:
  push:
    branches:
      - "lab/luna-ornith-repair-*"
    paths:
      - ".github/lab-requests/ornith-repair-*.md"
  pull_request:
    branches: [main]
    paths:
      - "tools/ornith_game_self_repair.py"
      - "tests/test_ornith_game_self_repair.py"
      - ".github/workflows/luna-ornith-self-repair.yml"

permissions:
  contents: read
  actions: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify source patch strict contracts and no fake Qwen authorship
        run: |
          python -m compileall -q tools/ornith_game_self_repair.py
          python -m unittest discover -s tests -p "test_ornith_game_self_repair.py" -v

  ornith-native-repair:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref,'refs/heads/lab/luna-ornith-repair-')) }}
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 72
    env:
      CI: "true"
      LD_LIBRARY_PATH: ${{ github.workspace }}/llama-build/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with:
          name: luna-model-replay-ornith-1.5-9b-40659377921
          run-id: 40659377921
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: replay-source/
      - name: Verify original game.js was generated by Ornith in archived run
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('replay-source')
          report=json.loads((p/'replay.json').read_text())
          assert report['model']=='ornith-1.5-9b' and report['run_id']==40653494692
          source=(p/'attempt-2/game.js').read_bytes()
          assert hashlib.sha256(source).hexdigest()==report['attempts'][1]['extracted_source_sha256']
          print('Verified original model authored JS source, unchanged.')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: f4d8af608a6b39946406f9439edfb6e83ca6a923
          path: llama-src
          persist-credentials: false
      - name: Build recent pinned llama.cpp supporting Qwen3.5-based model
        run: |
          cmake -S llama-src -B llama-build -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build llama-build --target llama-cli -j 4
      - name: Download SHA verified Ornith1.5 9B GGUF in disposable environment
        run: python tools/install_ornith_game_model.py --confirm-download --allow-linux-ci
      - name: Ask genuine Ornith to fix its own two browser-proven game bugs
        id: generate
        shell: bash
        run: |
          mkdir -p results/ornith-self-repair
          set +e
          python tools/ornith_game_self_repair.py \
            --model models/Ornith-1.5-9B-Q4_K_M.gguf \
            --runtime llama-build/bin/llama-cli \
            --input replay-source/attempt-2/game.js \
            --out results/ornith-self-repair --attempts 2
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            echo "Ornith did not write both fixes; preserving negative evidence." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$code"
          fi
      - name: Preserve model authored patches, entire revised JS, and original responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-ornith-repaired-${{ github.run_id }}
          path: results/ornith-self-repair/
          if-no-files-found: warn
          retention-days: 30

  browser-gameplay:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref,'refs/heads/lab/luna-ornith-repair-')) }}
    needs: ornith-native-repair
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LUNA_GAMEDEV_MODEL_URL: http://127.0.0.1:4813
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with:
          name: luna-ornith-repaired-${{ github.run_id }}
          path: results/ornith-self-repair
      - name: Fail closed if Ornith did not create a valid patch
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('results/ornith-self-repair')
          r=json.loads((p/'provenance.json').read_text())
          assert r['status']=='STATIC_REPAIR'
          assert r['patch_count']==2
          assert r['assistant_gameplay_code_used'] is False
          assert hashlib.sha256((p/'game.js').read_bytes()).hexdigest()==r['repaired_sha256']
          PY
          node --check results/ornith-self-repair/game.js
      - name: Wrap model written JS in static test-only HTML
        run: |
          cat > results/ornith-self-repair/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Ornith authentic browser playtest</title></head>
          <body style="margin:0;background:#101629;color:white;overflow-x:hidden">
          <canvas id="game" width="800" height="480"
            style="display:block;width:100%;max-width:800px;height:auto"></canvas>
          <script src="game.js" defer></script></body></html>
          HTML
      - name: Serve corrected game in isolated runner, not on GitHub Pages
        shell: bash
        run: |
          python -m http.server 4813 --bind 127.0.0.1 --directory results/ornith-self-repair >/tmp/luna-ornith-repair-http.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4813/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/luna-ornith-repair-http.log
          exit 1
      - name: Install Playwright and Chromium
        working-directory: site-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test real Ornith game movement, grounded jump, KeyZ enemy damage and mobile
        working-directory: site-tests
        run: npx playwright test --config playwright.model-gamedev.config.cjs
      - name: Upload browser trace and screenshots for genuine user-visible quality review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-ornith-fixed-browser-${{ github.run_id }}
          path: |
            site-tests/test-results/
            site-tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
