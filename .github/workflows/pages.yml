name: Luna Pages — Visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-tests/**"
      - "docs/DESIGN_SYSTEM.md"
      - "docs/GITHUB_PAGES.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "site-tests/**"
      - "docs/DESIGN_SYSTEM.md"
      - "docs/GITHUB_PAGES.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: luna-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Static gate / Playwright screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependency-free site checks
        run: node site-tests/static-smoke.cjs
      - name: Install Playwright dependencies
        working-directory: site-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Responsive functional regression
        working-directory: site-tests
        run: npm test
      - name: Upload screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-qa-${{ github.run_id }}
          path: |
            site-tests/test-results/
            site-tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

# This workflow tests UI and screenshots only. Publishing is performed by
# pages-manual-publish.yml using GitHub Actions as the configured Pages source.
