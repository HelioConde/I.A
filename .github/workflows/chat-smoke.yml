name: Brain-SSD Chat Smoke
on:
  push:
    paths:
      - "chat/**"
      - "src/brain_ssd/chat/**"
      - "tools/run_chat.py"
      - "tests/test_chat_windows.py"
      - "tests/test_chat_history.py"
      - "tests/test_chat_doctor.py"
      - "tests/test_chat_stream.py"
      - "tests/test_chat_episodic.py"
      - "tests/test_chat_episodic_http.py"
      - "tools/doctor_chat.py"
      - "tools/bench_episodic_memory.py"
      - "tools/run_cognitive_lab.py"
      - "tests/test_cognitive_lab.py"
      - ".github/workflows/chat-smoke.yml"
  pull_request:
    paths:
      - "chat/**"
      - "src/brain_ssd/chat/**"
      - "tools/run_chat.py"
      - "tests/test_chat_windows.py"
jobs:
  chat-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify syntax
        run: python -m compileall -q tools/run_chat.py tools/doctor_chat.py src/brain_ssd/chat tests/test_chat_windows.py tests/test_chat_history.py tests/test_chat_doctor.py tests/test_chat_stream.py tests/test_chat_episodic.py tests/test_chat_episodic_http.py tests/test_cognitive_lab.py tools/run_cognitive_lab.py
      - name: Test HTTP and chat adapter with mock CPU Core
        run: |
          python -m unittest discover -s tests -p "test_chat_windows.py" -v
          python -m unittest discover -s tests -p "test_chat_history.py" -v
          python -m unittest discover -s tests -p "test_chat_doctor.py" -v
          python -m unittest discover -s tests -p "test_chat_stream.py" -v
          python -m unittest discover -s tests -p "test_chat_episodic.py" -v
          python -m unittest discover -s tests -p "test_chat_episodic_http.py" -v
          python -m unittest discover -s tests -p "test_cognitive_lab.py" -v
      - name: Synthetic episodic negative controls (not a human memory benchmark)
        run: |
          python tools/bench_episodic_memory.py
          python tools/run_cognitive_lab.py
