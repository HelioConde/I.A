name: Luna Forge - MIT GitHub game corpus and scratch training

on:
  push:
    branches:
      - feature/luna-forge-zero
    paths:
      - "experiments/luna-forge-zero/github_corpus.py"
      - "experiments/luna-forge-zero/train_github.py"
      - "experiments/luna-forge-zero/original_lua_gameplay.lua"
      - "experiments/luna-forge-zero/test_original_lua_gameplay.lua"
      - "experiments/luna-forge-zero/original_lua_lessons.py"
      - "experiments/luna-forge-zero/evaluate_lua_codegen.py"
      - "tests/test_luna_original_lua_lessons.py"
      - "experiments/luna-forge-zero/action_platform_curriculum.json"
      - "experiments/luna-forge-zero/grandchase_research_catalog.json"
      - "experiments/luna-forge-zero/grandchase_reference_gate.py"
      - "tests/test_luna_grandchase_references.py"
      - "experiments/luna-forge-zero/evaluate_github_codegen.py"
      - "experiments/luna-forge-zero/luna_codegen_model.py"
      - "tests/test_luna_github_corpus.py"
      - ".github/workflows/luna-github-game-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline license and provenance tests
        run: python -m unittest discover -s tests -p test_luna_github_corpus.py -v
      - name: Verify Grand Chase reference policy and original lessons
        run: |
          python -m unittest discover -s tests -p test_luna_grandchase_references.py -v
          python experiments/luna-forge-zero/grandchase_reference_gate.py audit
      - name: Validate independently authored Lua lessons and heldout tasks
        run: |
          python -m unittest discover -s tests -p test_luna_original_lua_lessons.py -v
          python experiments/luna-forge-zero/original_lua_lessons.py verify
      - name: Run behavioral tests on ORIGINAL Lua module (not any game client)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 experiments/luna-forge-zero/test_original_lua_gameplay.lua
      - name: Download only pinned MIT-licensed code (no asset files)
        run: |
          cd experiments/luna-forge-zero
          python github_corpus.py collect --out external_data
          python github_corpus.py verify --out external_data
      - name: Install CPU-only PyTorch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train tiny MiniCoder from random weights on external game code
        run: |
          cd experiments/luna-forge-zero
          python train_github.py --data external_data --out external_data/model_candidate --curriculum action_platform_curriculum.json --steps 180 --batch 12 --threads 2 --lua-lessons
      - name: Evaluate candidate JS syntax without running game code
        run: |
          cd experiments/luna-forge-zero
          python evaluate_github_codegen.py --checkpoint external_data/model_candidate --out external_data/model_candidate/syntax_report.json
      - name: Evaluate GENERATED Lua code with luac parsing only
        run: |
          cd experiments/luna-forge-zero
          python evaluate_lua_codegen.py --checkpoint external_data/model_candidate --out external_data/model_candidate/lua_syntax_report.json
      - name: Verify checkpoint hash and publication guard
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('experiments/luna-forge-zero/external_data/model_candidate')
          r=json.loads((d/'report.json').read_text())
          assert hashlib.sha256((d/'weights.pt').read_bytes()).hexdigest()==r['weights_sha256']
          assert not r['promotion_allowed']
          assert r['grandchase_raw_repositories_in_training']==0
          assert r['original_curriculum_examples']==8
          assert r['original_lua_lessons']==6
          assert r['heldout_lua_answers_in_training']==0
          lua=json.loads((d/'lua_syntax_report.json').read_text())
          assert lua['syntax_verifier_available'] is True
          assert lua['generated_code_executed'] is False
          assert lua['training_promotion_allowed'] is False
          assert len(r['origin_repositories'])>=3
          assert len(r['heldout_repositories'])>=1
          print('Source checkpoints and heldout verified:',r['holdout_next_char_loss_before'],r['holdout_next_char_loss_after'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-github-game-corpus-and-model
          path: |
            experiments/luna-forge-zero/external_data/manifest.json
            experiments/luna-forge-zero/external_data/LICENSE_NOTICES.json
            experiments/luna-forge-zero/external_data/model_candidate/report.json
            experiments/luna-forge-zero/external_data/model_candidate/syntax_report.json
            experiments/luna-forge-zero/external_data/model_candidate/lua_syntax_report.json
            experiments/luna-forge-zero/external_data/model_candidate/weights.pt
          if-no-files-found: warn
          retention-days: 14
