name: Brain-SSD Core Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-regression.yml"
      - "src/brain_ssd/backend.py"
      - "src/brain_ssd/cache_policy.py"
      - "src/brain_ssd/cache_simulator.py"
      - "src/brain_ssd/cache_trace.py"
      - "src/brain_ssd/corpus.py"
      - "src/brain_ssd/gating.py"
      - "src/brain_ssd/hybrid.py"
      - "src/brain_ssd/progressive.py"
      - "src/brain_ssd/router.py"
      - "src/brain_ssd/semantic.py"
      - "src/brain_ssd/storage.py"
      - "src/brain_ssd/workloads.py"
      - "tests/test_core.py"
      - "tests/test_cache_policy.py"
      - "tests/test_router_gating.py"
      - "tests/test_hybrid.py"
      - "tests/test_progressive.py"
      - "tests/test_storage.py"
jobs:
  linux-algorithms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic CPU/storage/router/cache regression (no GGUF)
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_core.py" -v
          python -m unittest discover -s tests -p "test_storage.py" -v
          python -m unittest discover -s tests -p "test_router_gating.py" -v
          python -m unittest discover -s tests -p "test_cache_policy.py" -v
          python -m unittest discover -s tests -p "test_hybrid.py" -v
          python -m unittest discover -s tests -p "test_progressive.py" -v
