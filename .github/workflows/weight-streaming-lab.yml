name: Brain-SSD Weight Streaming Lab
on:
  workflow_dispatch:
  push:
    branches: [feat/ssd-weight-streaming-lab]
    paths:
      - "src/brain_ssd/weight_streaming_lab.py"
      - "src/brain_ssd/gguf_inspector.py"
      - "src/brain_ssd/weight_streaming_runtime.py"
      - "src/brain_ssd/weight_cache.py"
      - "src/brain_ssd/native_weight_windows.py"
      - "tools/bench_weight_streaming.py"
      - "tools/inspect_gguf.py"
      - "tools/bench_qwen_runtime.py"
      - "tools/probe_native_tensor_window.py"
      - "tests/test_weight_streaming_lab.py"
      - "tests/test_gguf_inspector.py"
      - "tests/test_weight_streaming_runtime.py"
      - "tests/test_weight_cache.py"
      - "tests/test_native_weight_windows.py"
      - "tools/prepare_native_llama_windows.py"
      - "tests/test_prepare_native_llama_windows.py"
      - "tests/test_bench_qwen_runtime.py"
      - "tools/bench_native_logits_windows.py"
      - "tools/native_llama_probe/native_logits_probe.cpp"
      - "tools/native_llama_probe/CMakeLists.txt"
      - "tests/test_bench_native_logits_windows.py"
      - "docs/WEIGHT_STREAMING_LAB.md"
      - ".github/workflows/weight-streaming-lab.yml"
jobs:
  weight-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run paging, GGUF-directory and safety tests
        run: |
          python -m unittest discover -s tests -p "test_weight_streaming_lab.py" -v
          python -m unittest discover -s tests -p "test_gguf_inspector.py" -v
          python -m unittest discover -s tests -p "test_weight_streaming_runtime.py" -v
          python -m unittest discover -s tests -p "test_weight_cache.py" -v
          python -m unittest discover -s tests -p "test_native_weight_windows.py" -v
          python -m unittest discover -s tests -p "test_prepare_native_llama_windows.py" -v
          python -m unittest discover -s tests -p "test_bench_qwen_runtime.py" -v
          python -m unittest discover -s tests -p "test_bench_native_logits_windows.py" -v
      - name: Verify matrix checksums on a synthetic 1 MiB window
        run: python tools/bench_weight_streaming.py --matrix --fixture-mib 1 --page-kib 128 --pages 8 --budget-mib 1 --turns 5 --pattern moe
