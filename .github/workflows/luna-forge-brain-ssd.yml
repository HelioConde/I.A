name: Luna Forge Zero - Brain SSD storage and isolation

on:
  push:
    branches:
      - feature/luna-forge-zero
    paths:
      - "experiments/luna-forge-zero/**"
      - "tests/test_luna_forge_brain_ssd.py"
      - ".github/workflows/luna-forge-brain-ssd.yml"
  pull_request:
    paths:
      - "experiments/luna-forge-zero/**"
      - "tests/test_luna_forge_brain_ssd.py"
      - ".github/workflows/luna-forge-brain-ssd.yml"
  workflow_dispatch:

jobs:
  linux-storage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_luna_forge_brain_ssd.py -v
  windows-storage-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_luna_forge_brain_ssd.py -v
