name: Brain-SSD Windows Chat Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "INICIAR-COPILOTO-WINDOWS.bat"
      - "LUNA.exemplo.ini"
      - "tools/launch_luna.py"
      - "tests/test_launch_luna_ini.py"
      - "tests/test_windows_launchers.py"
      - "tests/test_copilot.py"
      - "tests/test_copilot_queries.py"
      - "tests/test_luna_real_world_regression.py"
      - "src/brain_ssd/chat/copilot_queries.py"
      - "src/brain_ssd/chat/current_affairs.py"
      - "tests/test_copilot_question_battery.py"
      - "tests/test_jarvis_apps.py"
      - "tests/test_copilot_code_edits.py"
      - "tests/test_godot_diagnostics.py"
      - "tests/test_godot_validation.py"
      - "tests/test_agent_core.py"
      - "tests/test_model_patch_draft.py"
      - "src/brain_ssd/chat/model_patch_draft.py"
      - "src/brain_ssd/chat/agent_core.py"
      - "src/brain_ssd/chat/godot_validation.py"
      - "src/brain_ssd/chat/godot_diagnostics.py"
      - "src/brain_ssd/chat/code_edits.py"
      - "src/brain_ssd/chat/windows_apps.py"
      - "INICIAR-COPILOTO-WINDOWS.bat"
      - "tests/fixtures/copilot_question_battery.json"
      - "tools/run_copilot_question_battery.py"
      - ".github/workflows/windows-chat.yml"
      - "src/brain_ssd/chat/copilot.py"
      - "tools/run_chat.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-chat.yml"
      - "chat/**"
      - "src/brain_ssd/chat/**"
      - "tools/run_chat.py"
      - "tools/validate_chat_windows.py"
      - "tools/validate_chat_quality_windows.py"
      - "tools/doctor_chat.py"
      - "tools/install_windows_chat.py"
      - "tools/auto_setup_chat_windows.py"
      - "tests/test_auto_setup_chat_windows.py"
      - "INICIAR-BRAIN-SSD.bat"
      - "tests/test_install_windows_chat.py"
      - "PREPARAR-CHAT-WINDOWS.bat"
      - "DIAGNOSTICAR-CHAT-WINDOWS.bat"
      - "INICIAR-CHAT-MEMORIA-WINDOWS.bat"
      - "INICIAR-CHAT-WEB-WINDOWS.bat"
      - "tests/test_chat_history.py"
      - "tests/test_chat_doctor.py"
      - "tests/test_startup_diagnostics.py"
      - "INICIAR-CHAT-WINDOWS.bat"
      - "tests/test_chat_stream.py"
      - "tests/test_chat_episodic.py"
      - "tests/test_episodic_integrity.py"
      - "tools/audit_episodic_db.py"
      - "tests/test_memory_safety.py"
      - "tools/bench_memory_quality.py"
      - "tools/bench_semantic_bridge.py"
      - "tests/test_semantic_bridge.py"
      - "tests/test_chat_episodic_http.py"
      - "tools/bench_episodic_memory.py"
      - "tools/run_cognitive_lab.py"
      - "tests/test_cognitive_lab.py"
      - "tests/test_consolidation.py"
      - "tools/review_cognitive_memory.py"
      - "tools/run_diagnostics.py"
      - "tools/export_diagnostics.py"
      - "tests/test_diagnostics.py"
      - "tests/test_compare_diagnostics.py"
      - "tests/test_chat_static_ui.py"
      - "tests/test_windows_launchers.py"
      - "INICIAR-CHAT-WINDOWS.bat"
      - "tools/compare_diagnostics.py"
      - "GERAR-LOGS-WINDOWS.bat"
      - "tests/test_chat_runtime.py"
      - "tests/test_chat_completion_quality.py"
      - "tests/test_luna_report_review.py"
      - "tools/review_luna_evaluation.py"
      - "src/brain_ssd/chat/completion_quality.py"
      - "tests/test_chat_performance.py"
      - "src/brain_ssd/chat/performance.py"
      - "tests/test_chat_local_actions.py"
      - "tests/test_chat_web_search.py"
      - "tests/test_web_knowledge.py"
      - "tests/test_chat_learning_news.py"
      - "tests/test_chat_history.py"
      - "launcher/**"
      - "tools/build_windows_launcher.ps1"
concurrency:
  # PR and branch pushes share a group; keep only the newest test run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-chat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify JavaScript syntax
        shell: pwsh
        run: |
          node --check chat/app.js
          node --check chat/luna-hud.js
          node --check hud/app.js
      - name: Verify syntax
        shell: pwsh
        run: python -m compileall -q src/brain_ssd/chat tools/run_chat.py tools/validate_chat_windows.py tools/validate_chat_quality_windows.py tools/doctor_chat.py tools/install_windows_chat.py tools/auto_setup_chat_windows.py tests/test_install_windows_chat.py tests/test_auto_setup_chat_windows.py tests/test_chat_windows.py tests/test_chat_learning_news.py tests/test_chat_runtime.py tests/test_chat_history.py tests/test_chat_doctor.py tests/test_startup_diagnostics.py tests/test_chat_stream.py tests/test_chat_episodic.py tests/test_episodic_integrity.py tools/audit_episodic_db.py tests/test_memory_safety.py tests/test_semantic_bridge.py tests/test_chat_episodic_http.py tools/bench_memory_quality.py tools/bench_semantic_bridge.py tests/test_cognitive_lab.py tests/test_consolidation.py tools/run_cognitive_lab.py tools/review_cognitive_memory.py tools/run_diagnostics.py tools/export_diagnostics.py tests/test_diagnostics.py tests/test_compare_diagnostics.py tests/test_chat_static_ui.py tools/compare_diagnostics.py tests/test_windows_launchers.py
      - name: Test the Windows UI and independent chat adapter (mock Core)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_chat_windows.py" -v
          python -m unittest discover -s tests -p "test_chat_completion_quality.py" -v
          python -m unittest discover -s tests -p "test_luna_report_review.py" -v
          python -m unittest discover -s tests -p "test_review_luna_evaluation.py" -v
          python -m unittest discover -s tests -p "test_chat_local_actions.py" -v
          python -m unittest discover -s tests -p "test_chat_web_search.py" -v
          python -m unittest discover -s tests -p "test_web_knowledge.py" -v
          python -m unittest discover -s tests -p "test_chat_learning_news.py" -v
          python -m unittest discover -s tests -p "test_chat_runtime.py" -v
          python -m unittest discover -s tests -p "test_chat_performance.py" -v
          python -m unittest discover -s tests -p "test_chat_history.py" -v
          python -m unittest discover -s tests -p "test_chat_doctor.py" -v
          python -m unittest discover -s tests -p "test_install_windows_chat.py" -v
          python -m unittest discover -s tests -p "test_auto_setup_chat_windows.py" -v
          python -m unittest discover -s tests -p "test_startup_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_chat_stream.py" -v
          python -m unittest discover -s tests -p "test_chat_episodic.py" -v
          python -m unittest discover -s tests -p "test_episodic_integrity.py" -v
          python -m unittest discover -s tests -p "test_memory_safety.py" -v
          python -m unittest discover -s tests -p "test_semantic_bridge.py" -v
          python -m unittest discover -s tests -p "test_chat_episodic_http.py" -v
          python -m unittest discover -s tests -p "test_cognitive_lab.py" -v
          python -m unittest discover -s tests -p "test_consolidation.py" -v
          python -m unittest discover -s tests -p "test_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_compare_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_chat_static_ui.py" -v
          python -m unittest discover -s tests -p "test_windows_launchers.py" -v
          python -m unittest discover -s tests -p "test_launch_luna_ini.py" -v
          python -m unittest discover -s tests -p "test_copilot.py" -v
          python -m unittest discover -s tests -p "test_copilot_queries.py" -v
          python -m unittest discover -s tests -p "test_luna_real_world_regression.py" -v
          python -m unittest discover -s tests -p "test_copilot_question_battery.py" -v
          python -m unittest discover -s tests -p "test_jarvis_apps.py" -v
          python -m unittest discover -s tests -p "test_copilot_code_edits.py" -v
          python -m unittest discover -s tests -p "test_godot_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_godot_validation.py" -v
          python -m unittest discover -s tests -p "test_agent_core.py" -v
          python -m unittest discover -s tests -p "test_model_patch_draft.py" -v
      - name: Assert runtime unit tests independently
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_chat_runtime.py" -v
      - name: Synthetic episodic negative controls
        shell: pwsh
        run: |
          python tools/bench_episodic_memory.py
          python tools/bench_memory_quality.py
          python tools/bench_semantic_bridge.py
          python tools/run_cognitive_lab.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile updated Windows launcher
        shell: pwsh
        run: ./tools/build_windows_launcher.ps1
      - name: Publish launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainSSD-Windows-launcher
          path: dist/windows/BrainSSD.exe
          if-no-files-found: error

      - name: Build sanitized Windows diagnostic artifact (mock tests)
        if: always()
        shell: pwsh
        run: python tools/run_diagnostics.py --ci
      - name: Upload Windows diagnostic ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainSSD-diagnostics-Windows
          path: results/diagnostics/ci/brain-ssd-ci-diagnostics.zip
          if-no-files-found: warn
          retention-days: 14
