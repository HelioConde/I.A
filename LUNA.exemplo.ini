; LUNA / Brain-SSD — configuracao local padrao para este computador.
; O arquivo real LUNA.ini e criado automaticamente na primeira execucao.
; Edite LUNA.ini com o Bloco de Notas. Valores true/false; caminhos sem aspas.
; ATENCAO: root = C:/ permite acesso autorizado ao disco inteiro
; (exceto caminhos protegidos pelo Copiloto). Prefira uma pasta menor quando possivel.

[luna]
profile = economia
; vazio = seguir o comportamento do perfil economia (mais seguro para RAM)
core_mode =
; Padrão vazio = Qwen3-0.6B-Q8_0.gguf. Após instalar e testar o 4B,
; pode usar: model_file = Qwen3-4B-Q8_0.gguf
model_file =
port = 8766
open_browser = true
episodic_memory = true
cognitive_shadow = true
memory_aliases = false
web_search = true
web_provider = auto

[copilot]
root = C:/
; Para outras pastas, separar por ponto e virgula (;). Ex.: D:/Projetos;E:/Godot
extra_roots =
screen = true
apps = true
launch = true
; Somente ordens explicitas 'Abra X' poderao iniciar aplicativos sem clique.
; Bloqueia shells, scripts e ferramentas administrativas; sem executar caminhos.
launch_without_confirmation = true
edit = true
godot_validate = true
; Pode ser pasta que contenha Godot*.exe ou o caminho completo do executavel.
godot_path = C:\godot
